name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_classifier_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAG_DB_HOST: 127.0.0.1
      RAG_DB_PORT: 5432
      RAG_DB_DATABASE: ticket_classifier_rag
      RAG_DB_USERNAME: postgres
      RAG_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_pgsql, pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        # The homepage view uses @vite(...), which reads a compiled
        # manifest — ExampleTest hits "/" over HTTP, so it 500s without
        # this, even though no test asserts on JS/CSS.
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Enable pgvector extension
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ticket_classifier_rag -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run RAG migrations
        run: php artisan migrate --database=pgsql_rag --path=database/migrations/pgsql_rag --force

      - name: Run tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build
        run: npm run build
